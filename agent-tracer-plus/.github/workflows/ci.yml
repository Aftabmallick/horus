name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,otel,security,search]"

      - name: Run unit tests
        run: |
          pytest tests/unit -v --tb=short -q \
            --cov=agent_tracer_plus \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60

      - name: Run integration tests
        run: |
          pytest tests/integration -v --tb=short -q -m "not integration"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,otel,security]"

      - name: Ruff (lint)
        run: ruff check src/ tests/ --output-format=github

      - name: Ruff (format check)
        run: ruff format src/ tests/ --check

      - name: MyPy (type check)
        run: mypy src/agent_tracer_plus/ --ignore-missing-imports
        continue-on-error: true  # Non-blocking until type annotations are complete

  build:
    name: Build & Package Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install hatch twine

      - name: Build package
        run: hatch build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit --requirement <(pip show agent-tracer-plus | grep Requires | sed 's/Requires: //' | tr ',' '\n' | xargs -I{} echo {})
        continue-on-error: true  # Non-blocking, informational
