<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Tracer Plus - Local UI</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    /* Scrollbar styling for dark mode */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function formatTime(isoString) {
      if (!isoString) return '';
      return new Date(isoString).toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
    }

    function calculateDuration(start, end) {
      if (!start || !end) return '';
      const durationMs = new Date(end) - new Date(start);
      if (durationMs < 1000) return `${durationMs}ms`;
      return `${(durationMs / 1000).toFixed(2)}s`;
    }

    function App() {
      const [traces, setTraces] = useState([]);
      const [selectedTraceId, setSelectedTraceId] = useState(null);
      const [traceDetail, setTraceDetail] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetchTraces();
      }, []);

      useEffect(() => {
        if (selectedTraceId) {
          fetchTraceDetail(selectedTraceId);
        }
      }, [selectedTraceId]);

      const fetchTraces = async () => {
        try {
          const res = await fetch('/api/traces');
          const data = await res.json();
          setTraces(data.traces || []);
          if (data.traces && data.traces.length > 0 && !selectedTraceId) {
            setSelectedTraceId(data.traces[0].trace_id);
          }
        } catch (err) {
          console.error("Failed to fetch traces:", err);
        } finally {
          setLoading(false);
        }
      };

      const fetchTraceDetail = async (traceId) => {
        try {
          const res = await fetch(`/api/traces/${traceId}`);
          const data = await res.json();
          setTraceDetail(data);
        } catch (err) {
          console.error("Failed to fetch trace detail:", err);
        }
      };

      return (
        <div className="flex h-screen overflow-hidden bg-slate-900 text-slate-200">
          
          {/* Sidebar */}
          <div className="w-80 flex flex-col border-r border-slate-700 bg-slate-800">
            <div className="p-4 border-b border-slate-700">
              <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                Agent Tracer Plus
              </h1>
              <p className="text-xs text-slate-400 mt-1">Local Development Server</p>
            </div>
            
            <div className="flex-1 overflow-y-auto p-2">
              {loading ? (
                <div className="text-center p-4 text-slate-500">Loading traces...</div>
              ) : traces.length === 0 ? (
                <div className="text-center p-4 text-slate-500">No traces found in local storage.</div>
              ) : (
                traces.map(trace => (
                  <div 
                    key={trace.trace_id}
                    onClick={() => setSelectedTraceId(trace.trace_id)}
                    className={`p-3 mb-2 rounded cursor-pointer transition-colors ${selectedTraceId === trace.trace_id ? 'bg-blue-600/20 border border-blue-500/30' : 'bg-slate-700/50 hover:bg-slate-700'}`}
                  >
                    <div className="flex justify-between items-center mb-1">
                      <span className="font-medium truncate mr-2" title={trace.trace_id}>
                        {trace.trace_id.split('-')[0]}...
                      </span>
                      <span className={`text-xs px-2 py-0.5 rounded ${trace.status === 'ERROR' ? 'bg-red-500/20 text-red-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
                        {trace.status}
                      </span>
                    </div>
                    <div className="flex justify-between text-xs text-slate-400">
                      <span>{formatTime(trace.started_at)}</span>
                      <span>{calculateDuration(trace.started_at, trace.ended_at)}</span>
                    </div>
                  </div>
                ))
              )}
            </div>
            <div className="p-3 border-t border-slate-700 text-center">
              <button onClick={fetchTraces} className="text-sm text-slate-300 hover:text-white flex items-center justify-center w-full">
                Refresh Traces
              </button>
            </div>
          </div>

          {/* Main Content */}
          <div className="flex-1 flex flex-col bg-slate-900 overflow-hidden">
            {traceDetail ? (
              <TraceViewer trace={traceDetail.trace} spans={traceDetail.spans} />
            ) : (
              <div className="flex-1 flex items-center justify-center text-slate-500">
                Select a trace to view details
              </div>
            )}
          </div>
        </div>
      );
    }

    function TraceViewer({ trace, spans }) {
      const [selectedSpan, setSelectedSpan] = useState(null);

      // Simple tree reconstruction (assuming spans are flat and we just list them chronologically for local UI)
      // For a real waterfall we'd build a tree using parent_id, but a flat list is often easier to read for LLM chains.
      
      const selectSpan = (span) => {
        setSelectedSpan(span);
      };

      const getTypeColor = (type) => {
        const colors = {
          'LLM': 'bg-purple-500/20 text-purple-400 border-purple-500/30',
          'HTTP': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
          'DB': 'bg-amber-500/20 text-amber-400 border-amber-500/30',
          'TOOL': 'bg-orange-500/20 text-orange-400 border-orange-500/30',
          'AGENT': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
        };
        return colors[type] || 'bg-slate-500/20 text-slate-400 border-slate-500/30';
      };

      return (
        <div className="flex h-full">
          {/* Span List (Left Half) */}
          <div className={`${selectedSpan ? 'w-1/2 border-r border-slate-700' : 'w-full'} flex flex-col h-full overflow-hidden transition-all duration-300`}>
            <div className="p-4 border-b border-slate-700 bg-slate-800/50">
              <h2 className="text-lg font-semibold flex items-center gap-2">
                Trace: <span className="text-slate-400 font-mono text-sm">{trace.trace_id}</span>
              </h2>
              <div className="flex gap-4 mt-2 text-sm text-slate-400">
                <span>Start: {formatTime(trace.started_at)}</span>
                <span>Duration: {calculateDuration(trace.started_at, trace.ended_at)}</span>
                <span>Cost: ${trace.cost.toFixed(4)}</span>
                <span>Tokens: {trace.total_tokens}</span>
              </div>
            </div>
            
            <div className="flex-1 overflow-y-auto p-4 space-y-2">
              {spans.map((span, idx) => (
                <div 
                  key={span.span_id} 
                  onClick={() => selectSpan(span)}
                  className={`p-3 rounded border cursor-pointer hover:border-slate-500 transition-colors ${selectedSpan?.span_id === span.span_id ? 'bg-slate-800 border-slate-500' : 'bg-slate-800/30 border-slate-700'}`}
                >
                  <div className="flex justify-between items-start mb-2">
                    <div className="flex items-center gap-2">
                      <span className={`text-xs px-2 py-0.5 rounded border ${getTypeColor(span.span_type)}`}>
                        {span.span_type}
                      </span>
                      <span className="font-semibold">{span.name}</span>
                    </div>
                    <span className="text-xs text-slate-500 font-mono">{calculateDuration(span.started_at, span.ended_at)}</span>
                  </div>
                  
                  {span.status === 'ERROR' && (
                    <div className="text-xs text-red-400 bg-red-500/10 p-1.5 rounded mt-2 truncate">
                      {span.error_message}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>

          {/* Span Detail (Right Half) */}
          {selectedSpan && (
            <div className="w-1/2 flex flex-col h-full overflow-hidden bg-slate-900">
              <div className="p-4 border-b border-slate-700 bg-slate-800/50 flex justify-between items-center">
                <h3 className="font-semibold">{selectedSpan.name}</h3>
                <button onClick={() => setSelectedSpan(null)} className="text-slate-400 hover:text-white">✕</button>
              </div>
              
              <div className="flex-1 overflow-y-auto p-4 space-y-6">
                
                {selectedSpan.error_message && (
                  <div>
                    <h4 className="text-xs font-semibold text-red-400 mb-2 uppercase tracking-wider">Error</h4>
                    <pre className="bg-red-500/10 text-red-400 p-3 rounded font-mono text-sm whitespace-pre-wrap overflow-x-auto border border-red-500/20">
                      {selectedSpan.error_message}
                    </pre>
                  </div>
                )}

                <div>
                  <h4 className="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Input</h4>
                  <JSONViewer data={selectedSpan.input} />
                </div>
                
                <div>
                  <h4 className="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Output</h4>
                  <JSONViewer data={selectedSpan.output} />
                </div>
                
                <div>
                  <h4 className="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Attributes</h4>
                  <JSONViewer data={selectedSpan.attributes} />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function JSONViewer({ data }) {
      if (!data) return <div className="text-sm text-slate-500 italic">None</div>;
      
      let parsed = data;
      if (typeof data === 'string') {
        try {
          parsed = JSON.parse(data);
        } catch (e) {
          // If it's a string but not JSON, just show it
          return <pre className="bg-slate-800 p-3 rounded font-mono text-sm whitespace-pre-wrap overflow-x-auto border border-slate-700 text-emerald-300">{data}</pre>;
        }
      }
      
      return (
        <pre className="bg-slate-800 p-3 rounded font-mono text-sm whitespace-pre-wrap overflow-x-auto border border-slate-700 text-blue-300">
          {JSON.stringify(parsed, null, 2)}
        </pre>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
