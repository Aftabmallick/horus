version: '3.8'

# Agent Tracer Platform - Enterprise Docker Compose
# 
# This file contains the complete Hyper-Scale pipeline for 1M+ TPS.
# Configuration is managed directly in this YAML file.

services:
  # ----------------------------------------------------------------------
  # Database 1: PostgreSQL (Relational Store for Auth, Projects, Config)
  # ----------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: agent_tracer
    command: ["postgres", "-c", "max_connections=500"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d agent_tracer"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------
  # Database 2: ClickHouse (Columnar Store for Billions of Traces)
  # ----------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: defaultpassword
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------
  # Ingestion Buffer: Apache Kafka (KRaft Mode - No Zookeeper)
  # ----------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    user: "root"
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Auto-create topics so we don't need init scripts
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Format storage for KRaft automatically
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Auto-format storage for KRaft before starting
    command: >
      bash -c "
      if [ ! -f /tmp/kraft-combined-logs/meta.properties ]; then
        kafka-storage format --ignore-formatted -t MkU3OEVBNTcwNTJENDM2Qk -c /etc/kafka/kafka.properties;
      fi;
      /etc/confluent/docker/run"

  # ----------------------------------------------------------------------
  # Web API & Dashboard (The Control Plane)
  # ----------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: agent-tracer-platform/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/agent_tracer
      - CLICKHOUSE_URL=clickhouse://default:defaultpassword@clickhouse:8123
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PORT=3000
      - WORKERS_COUNT=4
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started

  # ----------------------------------------------------------------------
  # Background Ingestion Workers (Bulk Processors)
  # ----------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: agent-tracer-platform/worker.Dockerfile
    restart: always
    deploy:
      replicas: 1
    environment:
      - CLICKHOUSE_URL=clickhouse://default:defaultpassword@clickhouse:8123
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/agent_tracer
      - BATCH_SIZE=5000
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ----------------------------------------------------------------------
  # V3 Edge Ingestion Proxy (Rust/Axum)
  # ----------------------------------------------------------------------
  proxy:
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"
      - "50051:50051"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ----------------------------------------------------------------------
  # V3 Vector Database (Semantic Clustering)
  # ----------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ----------------------------------------------------------------------
  # Redis (Used for Chaos Monkey Config & PubSub)
  # ----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  clickhouse_data:
  kafka_data:
  qdrant_data:
  redis_data:
