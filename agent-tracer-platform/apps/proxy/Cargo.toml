[package]
name = "agent-tracer-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.4"
tokio = { version = "1.36.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rskafka = "0.5.0"
jsonwebtoken = "9.2.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
tower-http = { version = "0.5.1", features = ["cors"] }
chrono = "0.4.35"
tonic = "0.11"
prost = "0.12"

[build-dependencies]
tonic-build = "0.11"
